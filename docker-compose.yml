services:
  frontend:
    build:
      context: ./frontend
      dockerfile: dockerfile
    ports:
      - "5173:80"
    depends_on:
      backend:
        condition: service_started
    environment:
      - VITE_DOCKER_MODE=true

  backend:
    build:
      context: ./backend
      dockerfile: dockerfile
    ports:
      - "8000:8000"
    depends_on:
      ollama:
        condition: service_healthy
    environment:
      - PYTHONUNBUFFERED=1
      - OLLAMA_URL=http://ollama:11434
      - CHROMA_DB_PATH=/app/data/chroma_db
    volumes:
      - ./backend:/app
      - chroma_volume:/app/data/chroma_db
    env_file:
      - ./backend/.env

  ollama:
    build:
      context: ./LLM
      dockerfile: dockerfile
    container_name: ollama
    ports:
      - "11434:11434"
    volumes:
      - ollama_volume:/root/.ollama
    healthcheck:
      test: ["CMD-SHELL", "ollama list >/dev/null 2>&1 || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 30s

volumes:
  ollama_volume:
  chroma_volume:
